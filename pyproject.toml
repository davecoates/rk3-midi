[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rk3-midi"
version = "0.2.0"
description = "Userspace USB control reader for Native Instruments Rig Kontrol 3"
requires-python = ">=3.12"
dependencies = [
  "libusb-package>=1.0.26.3",
  "python-rtmidi>=1.5.8",
  "pyusb>=1.2.1",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.14", "pytest>=8.3", "ruff>=0.12"]

[project.scripts]
rk3-midi = "rk3_midi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
